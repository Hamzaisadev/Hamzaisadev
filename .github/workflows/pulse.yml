name: Pulse

on:
  schedule:
    - cron: "17 0 * * *"      # daily, after midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/src/pulse.py", "assets/src/gen.py", ".github/workflows/pulse.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install fonts and tools
        working-directory: assets/src
        run: |
          npm i --no-save --silent @fontsource/instrument-serif @fontsource/geist-sans @fontsource/geist-mono @fontsource/noto-nastaliq-urdu
          pip install -q uharfbuzz fonttools brotli
          python typeset.py

      - name: Draw the Pulse panel
        working-directory: assets/src
        env:
          # PULSE_TOKEN (classic PAT with read:user + repo) includes private work; falls back to public data.
          GITHUB_TOKEN: ${{ secrets.PULSE_TOKEN || github.token }}
        run: python pulse.py ..

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pulse-*.svg
          git diff --cached --quiet || (git commit -m "Redraw Pulse panel" && git pull --rebase -q && git push)

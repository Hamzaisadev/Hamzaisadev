name: Theme switch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: theme-switch
  cancel-in-progress: false

jobs:
  flip:
    if: startsWith(github.event.issue.title, 'theme:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Work out the mode
        id: mode
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          m=$(printf '%s' "$TITLE" | sed -E 's/^theme:[[:space:]]*//I' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z')
          case "$m" in light|auto|dark) echo "mode=$m" >> "$GITHUB_OUTPUT";; *) echo "mode=invalid" >> "$GITHUB_OUTPUT";; esac

      - name: Repaint README
        if: steps.mode.outputs.mode != 'invalid'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          WHO: ${{ github.event.issue.user.login }}
        run: |
          python3 assets/src/theme.py "$MODE" "$WHO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/theme.json
          git commit -m "Theme: $MODE (flipped by @$WHO)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          N: ${{ github.event.issue.number }}
        run: |
          if [ "$MODE" = "invalid" ]; then
            gh issue comment "$N" -R "$GITHUB_REPOSITORY" -b "That one didn't parse. Use one of the Light / Auto / Dark buttons on the profile."
          else
            gh issue comment "$N" -R "$GITHUB_REPOSITORY" -b "Done. The whole page is now **$MODE** for every visitor. Give GitHub a minute, then refresh https://github.com/${GITHUB_REPOSITORY_OWNER}. Thanks for playing."
          fi
          gh issue close "$N" -R "$GITHUB_REPOSITORY" --reason completed

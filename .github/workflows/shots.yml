name: Screenshots

on:
  schedule:
    - cron: "23 3 * * 1"         # Mondays
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Shoot the live sites
        run: python assets/src/shots.py assets
      - name: Commit and redraw cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shots
          git diff --cached --quiet && exit 0
          git commit -q -m "Weekly screenshots"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          gh workflow run live.yml

name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 00:00AM UTC
    - cron: '0 0 * * *'

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master #PLEASE USE MASTER BRANCH
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOCALE: "en"
          # Keep what helps someone hiring; hide what reads badly or contradicts "open to work".
          SHOW_PROJECTS: "False"        # private client project names
          SHOW_EDITORS: "False"
          SHOW_OS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_PROFILE_VIEWS: "False"   # always 0 here; the visitor board above is the real count
          SHOW_SHORT_INFO: "False"      # says "Not Opted to Hire", which contradicts the rest of the page
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"       # weekly AI cost / "0 lines by hand" breakdown
          SHOW_LINES_OF_CODE: "False"   # "2.54 million lines" isn't believable and invites doubt
          SHOW_LOC_CHART: "False"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="100%" role="presentation">
  <defs>
    <style>
      @keyframes beamSweep {
        0% { transform: translateX(-280px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      .beam { animation: beamSweep 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .beam { animation: none !important; opacity: 0.6 !important; transform: translateX(460px) !important; }
      }
    </style>
    <linearGradient id="lineBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="20%" stop-color="#1E293B" stop-opacity="1" />
      <stop offset="50%" stop-color="#334155" stop-opacity="1" />
      <stop offset="80%" stop-color="#1E293B" stop-opacity="1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#lineBase)" stroke-width="1.5" />
  <rect class="beam" x="0" y="10.5" width="260" height="3" rx="1.5" fill="url(#beamGrad)" />
  <circle cx="600" cy="12" r="3.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
</svg>

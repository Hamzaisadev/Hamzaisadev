<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 245" width="100%" height="100%" role="img" aria-label="Snapistan — Full-Stack Social Media Platform">
  <title>Snapistan — Modern Full-Stack Social Platform with Next.js, TypeScript &amp; Prisma</title>
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }

      @keyframes floatHeart {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.12); }
      }
      @keyframes streamDash {
        to { stroke-dashoffset: -40; }
      }

      .heart-badge {
        animation: floatHeart 2.5s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .social-edge {
        stroke-dasharray: 4 4;
        animation: streamDash 2s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .heart-badge, .social-edge { animation: none !important; }
      }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <radialGradient id="glow" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="578" height="243" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="243" rx="16" fill="url(#glow)" />

  <!-- Top Left Icon & Category Badge -->
  <g transform="translate(26, 24)">
    <rect x="0" y="0" width="42" height="42" rx="10" fill="#4C0519" fill-opacity="0.7" stroke="#F43F5E" stroke-width="1.2" />
    <!-- Social Feed / Nodes Icon -->
    <circle cx="15" cy="21" r="4" fill="#FB7185" />
    <circle cx="28" cy="14" r="3.5" fill="#C084FC" />
    <circle cx="28" cy="28" r="3.5" fill="#F43F5E" />
    <line x1="18" y1="19" x2="25" y2="15" stroke="#FDA4AF" stroke-width="1.6" />
    <line x1="18" y1="23" x2="25" y2="27" stroke="#FDA4AF" stroke-width="1.6" />

    <rect x="54" y="6" width="180" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="68" cy="19" r="3.5" fill="#F43F5E" />
    <text x="79" y="23" class="font-mono" font-size="10.5" font-weight="600" fill="#FB7185" letter-spacing="0.5">
      SOCIAL GRAPH · NEXT.JS
    </text>
  </g>

  <!-- Top Right Animated Social Graph & Live Feed Graphic -->
  <g transform="translate(380, 20)">
    <rect x="0" y="0" width="172" height="58" rx="10" fill="#090D16" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />

    <!-- Connected Social Graph Nodes -->
    <line class="social-edge" x1="30" y1="29" x2="72" y2="17" stroke="#F43F5E" stroke-width="1.5" />
    <line class="social-edge" x1="30" y1="29" x2="72" y2="41" stroke="#C084FC" stroke-width="1.5" />
    <line class="social-edge" x1="72" y1="17" x2="72" y2="41" stroke="#64748B" stroke-width="1.2" />

    <circle cx="30" cy="29" r="7" fill="#F43F5E" />
    <circle cx="72" cy="17" r="5.5" fill="#C084FC" />
    <circle cx="72" cy="41" r="5.5" fill="#38BDF8" />

    <!-- Animated Notification Pill -->
    <g class="heart-badge">
      <rect x="98" y="16" width="58" height="26" rx="13" fill="#4C0519" stroke="#F43F5E" stroke-width="1" />
      <text x="127" y="33" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FDA4AF">
        ♥ LIVE
      </text>
    </g>
  </g>

  <!-- Project Title & Subtitle -->
  <text x="26" y="102" class="font-sans" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="-0.4">
    Snapistan
  </text>
  <text x="148" y="101" class="font-mono" font-size="12" fill="#FB7185" font-weight="600">
    ↗ snapistan.vercel.app
  </text>

  <!-- Description -->
  <text x="26" y="132" class="font-sans" font-size="13.8" fill="#94A3B8">
    Full-stack social network with real-time post interactions, secure auth,
  </text>
  <text x="26" y="153" class="font-sans" font-size="13.8" fill="#94A3B8">
    instant notifications, and type-safe Prisma + PostgreSQL architecture.
  </text>

  <!-- Divider -->
  <line x1="26" y1="180" x2="554" y2="180" stroke="#1E293B" stroke-width="1" />

  <!-- Tech Stack Pills -->
  <g transform="translate(26, 196)" class="font-mono" font-size="11" font-weight="600">
    <rect x="0" y="0" width="74" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="37" y="17" text-anchor="middle" fill="#F8FAFC">Next.js</text>

    <rect x="82" y="0" width="88" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="126" y="17" text-anchor="middle" fill="#38BDF8">TypeScript</text>

    <rect x="178" y="0" width="90" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="223" y="17" text-anchor="middle" fill="#C084FC">Prisma ORM</text>

    <rect x="276" y="0" width="92" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="322" y="17" text-anchor="middle" fill="#60A5FA">PostgreSQL</text>

    <rect x="376" y="0" width="88" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="420" y="17" text-anchor="middle" fill="#FB7185">shadcn/ui</text>
  </g>
</svg>

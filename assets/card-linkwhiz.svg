<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 245" width="100%" height="100%" role="img" aria-label="LinkWhiz — Fast URL Shortening and Link Management Platform">
  <title>LinkWhiz — High-Speed URL Shortening &amp; Analytics Service</title>
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }

      @keyframes compressArrow {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(6px); }
      }
      @keyframes badgeGlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      .arrow-move {
        animation: compressArrow 2s ease-in-out infinite;
      }
      .short-pill {
        animation: badgeGlow 2.4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .arrow-move, .short-pill { animation: none !important; }
      }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <radialGradient id="glow" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="578" height="243" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="243" rx="16" fill="url(#glow)" />

  <!-- Top Left Icon & Category Badge -->
  <g transform="translate(26, 24)">
    <rect x="0" y="0" width="42" height="42" rx="10" fill="#3B0764" fill-opacity="0.7" stroke="#A855F7" stroke-width="1.2" />
    <!-- Chain Link Icon -->
    <path d="M 16 25 L 14 27 A 4.5 4.5 0 0 1 8 21 L 13 16 A 4.5 4.5 0 0 1 19 16" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" transform="translate(4, 0)" />
    <path d="M 22 17 L 24 15 A 4.5 4.5 0 0 1 30 21 L 25 26 A 4.5 4.5 0 0 1 19 26" fill="none" stroke="#E879F9" stroke-width="2" stroke-linecap="round" transform="translate(4, 0)" />

    <rect x="54" y="6" width="172" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="68" cy="19" r="3.5" fill="#C084FC" />
    <text x="79" y="23" class="font-mono" font-size="10.5" font-weight="600" fill="#D8B4FE" letter-spacing="0.5">
      WEB UTILITY · REACT
    </text>
  </g>

  <!-- Top Right Animated Link Compression Graphic -->
  <g transform="translate(380, 20)">
    <rect x="0" y="0" width="172" height="58" rx="10" fill="#090D16" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />

    <rect x="14" y="18" width="46" height="22" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="37" y="33" text-anchor="middle" class="font-mono" font-size="9.5" fill="#64748B">https://...</text>

    <g class="arrow-move">
      <path d="M 67 29 L 83 29 M 79 25 L 84 29 L 79 33" fill="none" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g class="short-pill">
      <rect x="94" y="16" width="64" height="26" rx="6" fill="#3B0764" stroke="#A855F7" stroke-width="1" />
      <text x="126" y="33" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#F3E8FF">
        ⚡ /lwz
      </text>
    </g>
  </g>

  <!-- Project Title & Subtitle -->
  <text x="26" y="102" class="font-sans" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="-0.4">
    LinkWhiz
  </text>
  <text x="144" y="101" class="font-mono" font-size="12" fill="#C084FC" font-weight="600">
    ↗ linkwhize.netlify.app
  </text>

  <!-- Description -->
  <text x="26" y="132" class="font-sans" font-size="13.8" fill="#94A3B8">
    Streamlined URL shortening and link management platform engineered
  </text>
  <text x="26" y="153" class="font-sans" font-size="13.8" fill="#94A3B8">
    for instant sharing, custom aliases, and friction-free distribution.
  </text>

  <!-- Divider -->
  <line x1="26" y1="180" x2="554" y2="180" stroke="#1E293B" stroke-width="1" />

  <!-- Tech Stack Pills -->
  <g transform="translate(26, 196)" class="font-mono" font-size="11" font-weight="600">
    <rect x="0" y="0" width="68" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="34" y="17" text-anchor="middle" fill="#61DAFB">React</text>

    <rect x="76" y="0" width="102" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="127" y="17" text-anchor="middle" fill="#F43F5E">React Router</text>

    <rect x="186" y="0" width="90" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="231" y="17" text-anchor="middle" fill="#FBBF24">JavaScript</text>

    <rect x="284" y="0" width="84" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="326" y="17" text-anchor="middle" fill="#C084FC">REST API</text>

    <rect x="376" y="0" width="76" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="414" y="17" text-anchor="middle" fill="#34D399">Netlify</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 245" width="100%" height="100%" role="img" aria-label="Stash — Zero-Login P2P File Drop, Screen Casting and Clipboard Sync">
  <title>Stash — Instant P2P File Sharing, WebRTC Screen Cast &amp; Clipboard Sync</title>
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }

      @keyframes packetRight {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(74px); opacity: 0; }
      }
      @keyframes packetLeft {
        0% { transform: translateX(74px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(0px); opacity: 0; }
      }
      @keyframes radarRing {
        0% { transform: scale(0.8); opacity: 0.85; }
        100% { transform: scale(1.9); opacity: 0; }
      }

      .pkt-1 { animation: packetRight 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .pkt-2 { animation: packetLeft 2.2s cubic-bezier(0.4, 0, 0.2, 1) 1.1s infinite; }
      .radar-1 { animation: radarRing 2.4s ease-out infinite; transform-origin: 30px 29px; }
      .radar-2 { animation: radarRing 2.4s ease-out 1.2s infinite; transform-origin: 142px 29px; }

      @media (prefers-reduced-motion: reduce) {
        .pkt-1, .pkt-2, .radar-1, .radar-2 { animation: none !important; }
      }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <radialGradient id="glow" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="578" height="243" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="243" rx="16" fill="url(#glow)" />

  <!-- Top Left Icon & Category Badge -->
  <g transform="translate(26, 24)">
    <rect x="0" y="0" width="42" height="42" rx="10" fill="#1E1B4B" fill-opacity="0.75" stroke="#6366F1" stroke-width="1.2" />
    <!-- Lightning Bolt Icon -->
    <path d="M 23 10 L 13 23 L 21 23 L 19 32 L 29 19 L 21 19 Z" fill="#818CF8" stroke="#C7D2FE" stroke-width="1" stroke-linejoin="round" />

    <rect x="54" y="6" width="174" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="68" cy="19" r="3.5" fill="#818CF8" />
    <text x="79" y="23" class="font-mono" font-size="10.5" font-weight="600" fill="#A5B4FC" letter-spacing="0.5">
      P2P &amp; WEBRTC · LIVE
    </text>
  </g>

  <!-- Top Right Animated P2P Node Transfer Graphic -->
  <g transform="translate(380, 20)">
    <rect x="0" y="0" width="172" height="58" rx="10" fill="#090D16" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />

    <!-- Connection Tracks -->
    <line x1="42" y1="24" x2="130" y2="24" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="42" y1="34" x2="130" y2="34" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Animated Data Packets -->
    <g class="pkt-1">
      <rect x="44" y="21" width="12" height="6" rx="3" fill="#38BDF8" />
    </g>
    <g class="pkt-2">
      <rect x="44" y="31" width="12" height="6" rx="3" fill="#818CF8" />
    </g>

    <!-- Left Device Node -->
    <circle class="radar-1" cx="30" cy="29" r="12" fill="none" stroke="#6366F1" stroke-width="1.2" />
    <rect x="18" y="17" width="24" height="24" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2" />
    <circle cx="30" cy="29" r="3.5" fill="#38BDF8" />

    <!-- Right Device Node -->
    <circle class="radar-2" cx="142" cy="29" r="12" fill="none" stroke="#38BDF8" stroke-width="1.2" />
    <rect x="130" y="17" width="24" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="142" cy="29" r="3.5" fill="#818CF8" />
  </g>

  <!-- Project Title & Subtitle -->
  <text x="26" y="102" class="font-sans" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="-0.4">
    Stash
  </text>
  <text x="104" y="101" class="font-mono" font-size="12" fill="#818CF8" font-weight="600">
    ↗ stash-ed.vercel.app
  </text>

  <!-- Description -->
  <text x="26" y="132" class="font-sans" font-size="13.8" fill="#94A3B8">
    Zero-login ephemeral drop-zone for blazing-fast P2P file transfers,
  </text>
  <text x="26" y="153" class="font-sans" font-size="13.8" fill="#94A3B8">
    1-click WebRTC screen &amp; camera casting, and live clipboard sync.
  </text>

  <!-- Divider -->
  <line x1="26" y1="180" x2="554" y2="180" stroke="#1E293B" stroke-width="1" />

  <!-- Tech Stack Pills -->
  <g transform="translate(26, 196)" class="font-mono" font-size="11" font-weight="600">
    <rect x="0" y="0" width="76" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="38" y="17" text-anchor="middle" fill="#818CF8">WebRTC</text>

    <rect x="84" y="0" width="84" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="126" y="17" text-anchor="middle" fill="#38BDF8">P2P Sync</text>

    <rect x="176" y="0" width="90" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="221" y="17" text-anchor="middle" fill="#FBBF24">JavaScript</text>

    <rect x="274" y="0" width="106" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="327" y="17" text-anchor="middle" fill="#34D399">Ephemeral Rooms</text>

    <rect x="388" y="0" width="88" height="26" rx="6" fill="#0F172A" stroke="#1E293B" />
    <text x="432" y="17" text-anchor="middle" fill="#F472B6">Zero-Auth</text>
  </g>
</svg>

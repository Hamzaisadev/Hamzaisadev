<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%" role="img" aria-label="Hamza Ishaq — Full-Stack Product Engineer and AI Systems Builder">
  <title>Hamza Ishaq (@Hamzaisadev) — Full-Stack Product Engineer &amp; AI Systems Builder</title>
  <desc>Animated hero banner showcasing Hamza Ishaq's engineering focus, live status from Karachi, Pakistan, and real-time product telemetry.</desc>
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }

      /* Ambient aurora glow animations */
      @keyframes pulseGlow1 {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.72; transform: scale(1.08); }
      }
      @keyframes pulseGlow2 {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.62; transform: scale(1.1); }
      }

      /* Floating HUD card animation (applied to inner wrapper only!) */
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      /* Status dot pulse */
      @keyframes ping {
        0% { transform: scale(1); opacity: 0.9; }
        75%, 100% { transform: scale(2.6); opacity: 0; }
      }

      /* Cursor blink */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Traveling data lines */
      @keyframes dashFlow {
        to { stroke-dashoffset: -240; }
      }

      /* Telemetry bar equalizer */
      @keyframes bar1 { 0%, 100% { height: 14px; y: 22px; } 50% { height: 28px; y: 8px; } }
      @keyframes bar2 { 0%, 100% { height: 24px; y: 12px; } 50% { height: 10px; y: 26px; } }
      @keyframes bar3 { 0%, 100% { height: 16px; y: 20px; } 50% { height: 30px; y: 6px; } }
      @keyframes bar4 { 0%, 100% { height: 28px; y: 8px; } 50% { height: 14px; y: 22px; } }
      @keyframes bar5 { 0%, 100% { height: 14px; y: 22px; } 50% { height: 26px; y: 10px; } }

      /* Scanline subtle sweep */
      @keyframes scanSweep {
        0% { transform: translateY(-20px); opacity: 0; }
        20% { opacity: 0.4; }
        80% { opacity: 0.4; }
        100% { transform: translateY(430px); opacity: 0; }
      }

      .aurora-1 { animation: pulseGlow1 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .aurora-2 { animation: pulseGlow2 11s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .hud-card { animation: floatCard 6s ease-in-out infinite; }
      .hud-subbadge { animation: floatBadge 5s ease-in-out infinite; }
      .ping-ring { animation: ping 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; transform-box: fill-box; transform-origin: center; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .flow-line { stroke-dasharray: 8 16; animation: dashFlow 6s linear infinite; }
      .flow-line-fast { stroke-dasharray: 12 28; animation: dashFlow 4s linear infinite; }
      .eq-1 { animation: bar1 1.8s ease-in-out infinite; }
      .eq-2 { animation: bar2 1.4s ease-in-out infinite; }
      .eq-3 { animation: bar3 2.1s ease-in-out infinite; }
      .eq-4 { animation: bar4 1.6s ease-in-out infinite; }
      .eq-5 { animation: bar5 1.9s ease-in-out infinite; }
      .scan-line { animation: scanSweep 8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .aurora-1, .aurora-2, .hud-card, .hud-subbadge, .ping-ring, .cursor,
        .flow-line, .flow-line-fast, .eq-1, .eq-2, .eq-3, .eq-4, .eq-5, .scan-line {
          animation: none !important;
        }
      }
    </style>

    <!-- Background & Surface Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080E" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <radialGradient id="emeraldGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06080E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="82%" cy="65%" r="48%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#06080E" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131C2E" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot & Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.6" />
    </pattern>

    <clipPath id="bannerClip">
      <rect width="1200" height="430" rx="20" ry="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Canvas -->
    <rect width="1200" height="430" fill="url(#bgGrad)" />

    <!-- Architectural Grid Overlay -->
    <rect width="1200" height="430" fill="url(#cyberGrid)" />

    <!-- Ambient Animated Auroras -->
    <ellipse class="aurora-1" cx="260" cy="110" rx="460" ry="260" fill="url(#emeraldGlow)" />
    <ellipse class="aurora-2" cx="950" cy="290" rx="480" ry="280" fill="url(#indigoGlow)" />

    <!-- Subtle Sweep Scanline -->
    <rect class="scan-line" x="0" y="0" width="1200" height="2" fill="url(#scanGrad)" />

    <!-- Decorative Animated Circuit Paths -->
    <path d="M 0 360 Q 320 360 440 310 T 760 280" fill="none" stroke="#1E293B" stroke-width="1.5" />
    <path class="flow-line" d="M 0 360 Q 320 360 440 310 T 760 280" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.65" />

    <path d="M 680 0 Q 730 140 850 180 T 1200 210" fill="none" stroke="#1E293B" stroke-width="1.2" />
    <path class="flow-line-fast" d="M 680 0 Q 730 140 850 180 T 1200 210" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.45" />

    <!-- ================= LEFT COLUMN: IDENTITY & MISSION ================= -->

    <!-- Live Status Pill -->
    <g>
      <rect x="64" y="54" width="428" height="36" rx="18" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.2" />
      <circle class="ping-ring" cx="86" cy="72" r="5" fill="#10B981" />
      <circle cx="86" cy="72" r="4.5" fill="#10B981" />
      <text x="102" y="76.5" class="font-mono" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="0.6">
        AVAILABLE FOR PROJECTS <tspan fill="#475569">·</tspan> <tspan fill="#34D399">KARACHI, PK (UTC+5)</tspan>
      </text>
    </g>

    <!-- Main Name & Handle -->
    <text x="64" y="154" class="font-sans" font-size="58" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1.2">
      Hamza Ishaq
    </text>

    <!-- Handle Badge inline -->
    <g transform="translate(442, 114)">
      <rect x="0" y="0" width="142" height="32" rx="8" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="71" y="20.5" text-anchor="middle" class="font-mono" font-size="13" font-weight="600" fill="#38BDF8">
        @Hamzaisadev
      </text>
    </g>

    <!-- Role Headline -->
    <text x="64" y="196" class="font-sans" font-size="21.5" font-weight="700" fill="url(#accentGrad)">
      Full-Stack Product Engineer &amp; AI Systems Builder
    </text>

    <!-- Value Proposition Copy -->
    <text x="64" y="234" class="font-sans" font-size="15" fill="#94A3B8">
      Architecting fast, zero-friction web applications, clinical AI platforms, and
    </text>
    <text x="64" y="256" class="font-sans" font-size="15" fill="#94A3B8">
      real-time P2P tools that turn complex workflows into effortless software.
    </text>

    <!-- Interactive-Style Command Prompt Strip -->
    <g transform="translate(64, 284)">
      <rect x="0" y="0" width="568" height="46" rx="10" fill="#090D16" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="46" rx="2" fill="url(#accentGrad)" />
      <text x="18" y="28" class="font-mono" font-size="12.5" font-weight="600" xml:space="preserve"><tspan fill="#34D399" font-weight="700">➜ </tspan><tspan fill="#38BDF8">~/hamza </tspan><tspan fill="#64748B">git:(</tspan><tspan fill="#F43F5E">main</tspan><tspan fill="#64748B">) </tspan><tspan fill="#E2E8F0" font-weight="400">ship --stack="Next.js, TS, Supabase, AI" </tspan><tspan class="cursor" fill="#34D399">▋</tspan></text>
    </g>

    <!-- Core Engineering Pillars Chips -->
    <g transform="translate(64, 350)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="136" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="15" r="3.5" fill="#34D399" />
      <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">Next.js &amp; React</text>

      <!-- Chip 2 -->
      <rect x="148" y="0" width="132" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="164" cy="15" r="3.5" fill="#38BDF8" />
      <text x="176" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">TypeScript</text>

      <!-- Chip 3 -->
      <rect x="292" y="0" width="136" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="308" cy="15" r="3.5" fill="#818CF8" />
      <text x="320" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">Generative AI</text>

      <!-- Chip 4 -->
      <rect x="440" y="0" width="128" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="456" cy="15" r="3.5" fill="#F43F5E" />
      <text x="468" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">WebRTC / P2P</text>
    </g>

    <!-- ================= RIGHT COLUMN: FLOATING TELEMETRY HUD ================= -->
    <!-- Static positioning wrapper so CSS animation never overrides X/Y coordinates! -->
    <g transform="translate(684, 52)">
      <g class="hud-card">
        <!-- Card Drop Shadow / Glow -->
        <rect x="6" y="10" width="456" height="320" rx="16" fill="#020617" fill-opacity="0.75" />
        <!-- Glassmorphic Card Frame -->
        <rect x="0" y="0" width="456" height="320" rx="16" fill="url(#cardGlass)" stroke="url(#cardBorder)" stroke-width="1.5" />

        <!-- Window Header Bar -->
        <path d="M 0 16 Q 0 0 16 0 L 440 0 Q 456 0 456 16 L 456 42 L 0 42 Z" fill="#070A12" />
        <line x1="0" y1="42" x2="456" y2="42" stroke="#1E293B" stroke-width="1" />

        <!-- macOS Window Controls -->
        <circle cx="22" cy="21" r="5.5" fill="#F43F5E" />
        <circle cx="40" cy="21" r="5.5" fill="#F59E0B" />
        <circle cx="58" cy="21" r="5.5" fill="#10B981" />

        <text x="228" y="25" text-anchor="middle" class="font-mono" font-size="11.5" fill="#64748B" font-weight="600">
          hamza.config.ts — telemetry
        </text>

        <!-- Live Equalizer Bars in Top Right of Window -->
        <g transform="translate(394, 3)">
          <rect class="eq-1" x="0" y="20" width="4" height="16" rx="2" fill="#34D399" />
          <rect class="eq-2" x="7" y="14" width="4" height="22" rx="2" fill="#22D3EE" />
          <rect class="eq-3" x="14" y="18" width="4" height="18" rx="2" fill="#818CF8" />
          <rect class="eq-4" x="21" y="10" width="4" height="26" rx="2" fill="#34D399" />
          <rect class="eq-5" x="28" y="16" width="4" height="20" rx="2" fill="#22D3EE" />
        </g>

        <!-- Code Content Inside Window -->
        <g transform="translate(22, 68)" class="font-mono" font-size="12.5">
          <text x="0" y="0" xml:space="preserve"><tspan x="0" fill="#475569">01</tspan><tspan x="28" fill="#C084FC">export const </tspan><tspan fill="#38BDF8">engineer</tspan><tspan fill="#E2E8F0"> = {</tspan></text>
          <text x="0" y="24" xml:space="preserve"><tspan x="0" fill="#475569">02</tspan><tspan x="44" fill="#94A3B8">name: </tspan><tspan fill="#34D399">"Hamza Ishaq"</tspan><tspan fill="#64748B">,</tspan></text>
          <text x="0" y="48" xml:space="preserve"><tspan x="0" fill="#475569">03</tspan><tspan x="44" fill="#94A3B8">focus: </tspan><tspan fill="#FBBF24">"AI-Native Web Products"</tspan><tspan fill="#64748B">,</tspan></text>
          <text x="0" y="72" xml:space="preserve"><tspan x="0" fill="#475569">04</tspan><tspan x="44" fill="#94A3B8">flagships: </tspan><tspan fill="#E2E8F0">[</tspan><tspan fill="#38BDF8">"Curewell"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#34D399">"Stash"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#818CF8">"GadiGhar"</tspan><tspan fill="#E2E8F0">],</tspan></text>
          <text x="0" y="96" xml:space="preserve"><tspan x="0" fill="#475569">05</tspan><tspan x="44" fill="#94A3B8">architecture: </tspan><tspan fill="#34D399">"Offline-First &amp; Real-Time"</tspan><tspan fill="#64748B">,</tspan></text>
          <text x="0" y="120" xml:space="preserve"><tspan x="0" fill="#475569">06</tspan><tspan x="44" fill="#94A3B8">obsessions: </tspan><tspan fill="#E2E8F0">[</tspan><tspan fill="#F472B6">"Clean UX"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#38BDF8">"Zero-Latency"</tspan><tspan fill="#E2E8F0">],</tspan></text>
          <text x="0" y="144" xml:space="preserve"><tspan x="0" fill="#475569">07</tspan><tspan x="44" fill="#94A3B8">status: </tspan><tspan fill="#34D399">"Shipping daily ⚡"</tspan></text>
          <text x="0" y="168" xml:space="preserve"><tspan x="0" fill="#475569">08</tspan><tspan x="28" fill="#E2E8F0">};</tspan></text>
        </g>

        <!-- Bottom Telemetry Metrics Strip inside HUD -->
        <line x1="22" y1="256" x2="434" y2="256" stroke="#1E293B" stroke-width="1" />

        <g transform="translate(26, 270)">
          <!-- Metric 1 -->
          <text x="0" y="12" class="font-mono" font-size="10" fill="#64748B" letter-spacing="0.8">PUBLIC REPOS</text>
          <text x="0" y="33" class="font-sans" font-size="19" font-weight="800" fill="#F8FAFC">36+</text>

          <!-- Metric 2 -->
          <line x1="128" y1="2" x2="128" y2="36" stroke="#1E293B" stroke-width="1" />
          <text x="148" y="12" class="font-mono" font-size="10" fill="#64748B" letter-spacing="0.8">LINES WRITTEN</text>
          <text x="148" y="33" class="font-sans" font-size="19" font-weight="800" fill="#34D399">1.24M+</text>

          <!-- Metric 3 -->
          <line x1="284" y1="2" x2="284" y2="36" stroke="#1E293B" stroke-width="1" />
          <text x="304" y="12" class="font-mono" font-size="10" fill="#64748B" letter-spacing="0.8">CORE STACK</text>
          <text x="304" y="33" class="font-sans" font-size="19" font-weight="800" fill="#38BDF8">TS / Next</text>
        </g>
      </g>
    </g>

    <!-- Floating Sub-Badge anchored cleanly at top-right of HUD -->
    <g transform="translate(922, 16)">
      <g class="hud-subbadge">
        <rect x="0" y="0" width="204" height="40" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.75" />
        <circle cx="20" cy="20" r="8" fill="#10B981" fill-opacity="0.2" />
        <path d="M 16 20 L 19 23 L 25 17" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="35" y="17" class="font-sans" font-size="11" font-weight="700" fill="#F8FAFC">Production Ready</text>
        <text x="35" y="30" class="font-mono" font-size="9.5" fill="#34D399">Vercel · Supabase · Edge</text>
      </g>
    </g>

    <!-- Outer Subtle Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="20" ry="20" fill="none" stroke="#1E293B" stroke-width="1.5" />
  </g>
</svg>

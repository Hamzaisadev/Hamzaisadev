<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%" role="img" aria-label="Hamza Ishaq — Full-Stack Product Engineer and AI Systems Builder">
  <title>Hamza Ishaq (@Hamzaisadev) — Full-Stack Product Engineer &amp; AI Systems Builder</title>
  <desc>Animated hero banner showcasing Hamza Ishaq's engineering focus, live status from Karachi, Pakistan, and real-time product telemetry.</desc>
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }

      /* Ambient aurora glow animations */
      @keyframes pulseGlow1 {
        0%, 100% { opacity: 0.45; transform: translate(0px, 0px) scale(1); }
        50% { opacity: 0.7; transform: translate(25px, -15px) scale(1.08); }
      }
      @keyframes pulseGlow2 {
        0%, 100% { opacity: 0.35; transform: translate(0px, 0px) scale(1); }
        50% { opacity: 0.6; transform: translate(-30px, 20px) scale(1.1); }
      }

      /* Floating HUD card animation */
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      /* Status dot pulse */
      @keyframes ping {
        0% { transform: scale(1); opacity: 0.9; }
        75%, 100% { transform: scale(2.6); opacity: 0; }
      }

      /* Cursor blink */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Traveling data lines */
      @keyframes dashFlow {
        to { stroke-dashoffset: -240; }
      }

      /* Telemetry bar equalizer */
      @keyframes bar1 { 0%, 100% { height: 14px; y: 26px; } 50% { height: 32px; y: 8px; } }
      @keyframes bar2 { 0%, 100% { height: 28px; y: 12px; } 50% { height: 12px; y: 28px; } }
      @keyframes bar3 { 0%, 100% { height: 20px; y: 20px; } 50% { height: 36px; y: 4px; } }
      @keyframes bar4 { 0%, 100% { height: 34px; y: 6px; } 50% { height: 16px; y: 24px; } }
      @keyframes bar5 { 0%, 100% { height: 18px; y: 22px; } 50% { height: 30px; y: 10px; } }

      /* Scanline subtle sweep */
      @keyframes scanSweep {
        0% { transform: translateY(-430px); opacity: 0; }
        20% { opacity: 0.35; }
        80% { opacity: 0.35; }
        100% { transform: translateY(430px); opacity: 0; }
      }

      .aurora-1 { animation: pulseGlow1 9s ease-in-out infinite; transform-origin: center; }
      .aurora-2 { animation: pulseGlow2 11s ease-in-out infinite; transform-origin: center; }
      .hud-card { animation: floatCard 6s ease-in-out infinite; }
      .hud-subbadge { animation: floatBadge 5s ease-in-out infinite; }
      .ping-ring { animation: ping 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; transform-origin: 96px 76px; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .flow-line { stroke-dasharray: 8 16; animation: dashFlow 6s linear infinite; }
      .flow-line-fast { stroke-dasharray: 12 28; animation: dashFlow 4s linear infinite; }
      .eq-1 { animation: bar1 1.8s ease-in-out infinite; }
      .eq-2 { animation: bar2 1.4s ease-in-out infinite; }
      .eq-3 { animation: bar3 2.1s ease-in-out infinite; }
      .eq-4 { animation: bar4 1.6s ease-in-out infinite; }
      .eq-5 { animation: bar5 1.9s ease-in-out infinite; }
      .scan-line { animation: scanSweep 8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .aurora-1, .aurora-2, .hud-card, .hud-subbadge, .ping-ring, .cursor,
        .flow-line, .flow-line-fast, .eq-1, .eq-2, .eq-3, .eq-4, .eq-5, .scan-line {
          animation: none !important;
        }
      }
    </style>

    <!-- Background & Surface Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080E" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <radialGradient id="emeraldGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06080E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="82%" cy="65%" r="48%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#06080E" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot & Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.6" />
    </pattern>

    <clipPath id="bannerClip">
      <rect width="1200" height="430" rx="20" ry="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Canvas -->
    <rect width="1200" height="430" fill="url(#bgGrad)" />

    <!-- Architectural Grid Overlay -->
    <rect width="1200" height="430" fill="url(#cyberGrid)" />

    <!-- Ambient Animated Auroras -->
    <ellipse class="aurora-1" cx="260" cy="110" rx="460" ry="260" fill="url(#emeraldGlow)" />
    <ellipse class="aurora-2" cx="950" cy="290" rx="480" ry="280" fill="url(#indigoGlow)" />

    <!-- Subtle Sweep Scanline -->
    <rect class="scan-line" x="0" y="0" width="1200" height="2" fill="url(#scanGrad)" />

    <!-- Decorative Animated Circuit Paths -->
    <path d="M 0 360 Q 320 360 440 310 T 760 280" fill="none" stroke="#1E293B" stroke-width="1.5" />
    <path class="flow-line" d="M 0 360 Q 320 360 440 310 T 760 280" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.65" />

    <path d="M 680 0 Q 730 140 850 180 T 1200 210" fill="none" stroke="#1E293B" stroke-width="1.2" />
    <path class="flow-line-fast" d="M 680 0 Q 730 140 850 180 T 1200 210" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.45" />

    <!-- ================= LEFT COLUMN: IDENTITY & MISSION ================= -->

    <!-- Live Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="76" y="58" width="420" height="36" rx="18" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2" />
      <circle class="ping-ring" cx="96" cy="76" r="5" fill="#10B981" />
      <circle cx="96" cy="76" r="4.5" fill="#10B981" />
      <text x="112" y="80.5" class="font-mono" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
        AVAILABLE FOR PROJECTS <tspan fill="#334155">·</tspan> <tspan fill="#34D399">KARACHI, PK (UTC+5)</tspan>
      </text>
    </g>

    <!-- Main Name & Handle -->
    <text x="76" y="158" class="font-sans" font-size="60" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1.5">
      Hamza Ishaq
    </text>

    <!-- Handle Badge inline -->
    <g transform="translate(465, 118)">
      <rect x="0" y="0" width="146" height="32" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="73" y="20.5" text-anchor="middle" class="font-mono" font-size="13" font-weight="600" fill="#38BDF8">
        @Hamzaisadev
      </text>
    </g>

    <!-- Role Headline -->
    <text x="76" y="198" class="font-sans" font-size="22" font-weight="600" fill="url(#accentGrad)" letter-spacing="-0.2">
      Full-Stack Product Engineer &amp; AI Systems Builder
    </text>

    <!-- Value Proposition Copy -->
    <text x="76" y="236" class="font-sans" font-size="15" fill="#94A3B8" letter-spacing="0.1">
      Architecting fast, zero-friction web applications, clinical AI platforms, and
    </text>
    <text x="76" y="258" class="font-sans" font-size="15" fill="#94A3B8" letter-spacing="0.1">
      real-time P2P tools that turn complex workflows into effortless software.
    </text>

    <!-- Interactive-Style Command Prompt Strip -->
    <g transform="translate(76, 286)">
      <rect x="0" y="0" width="565" height="46" rx="10" fill="#090D16" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="46" rx="2" fill="url(#accentGrad)" />
      <text x="18" y="28" class="font-mono" font-size="13" fill="#34D399" font-weight="700">➜</text>
      <text x="38" y="28" class="font-mono" font-size="13" fill="#38BDF8" font-weight="600">~/hamza</text>
      <text x="104" y="28" class="font-mono" font-size="13" fill="#64748B">git:(</text>
      <text x="142" y="28" class="font-mono" font-size="13" fill="#F43F5E" font-weight="600">main</text>
      <text x="175" y="28" class="font-mono" font-size="13" fill="#64748B">)</text>
      <text x="192" y="28" class="font-mono" font-size="13" fill="#E2E8F0">
        ship --stack="Next.js, TS, Supabase, AI"
      </text>
      <rect class="cursor" x="512" y="15" width="8" height="17" rx="1.5" fill="#34D399" />
    </g>

    <!-- Core Engineering Pillars Chips -->
    <g transform="translate(76, 352)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="136" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="15" r="3.5" fill="#34D399" />
      <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">Next.js &amp; React</text>

      <!-- Chip 2 -->
      <rect x="148" y="0" width="132" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="164" cy="15" r="3.5" fill="#38BDF8" />
      <text x="176" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">TypeScript</text>

      <!-- Chip 3 -->
      <rect x="292" y="0" width="136" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="308" cy="15" r="3.5" fill="#818CF8" />
      <text x="320" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">Generative AI</text>

      <!-- Chip 4 -->
      <rect x="440" y="0" width="125" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <circle cx="456" cy="15" r="3.5" fill="#F43F5E" />
      <text x="468" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#CBD5E1">WebRTC / P2P</text>
    </g>

    <!-- ================= RIGHT COLUMN: FLOATING TELEMETRY HUD ================= -->
    <g class="hud-card" transform="translate(690, 56)">
      <!-- Card Drop Shadow / Glow -->
      <rect x="4" y="8" width="444" height="316" rx="16" fill="#020617" fill-opacity="0.7" />
      <!-- Glassmorphic Card Frame -->
      <rect x="0" y="0" width="444" height="316" rx="16" fill="url(#cardGlass)" stroke="url(#cardBorder)" stroke-width="1.5" />

      <!-- Window Header Bar -->
      <path d="M 0 16 Q 0 0 16 0 L 428 0 Q 444 0 444 16 L 444 42 L 0 42 Z" fill="#090D16" fill-opacity="0.75" />
      <line x1="0" y1="42" x2="444" y2="42" stroke="#1E293B" stroke-width="1" />

      <!-- macOS Window Controls -->
      <circle cx="22" cy="21" r="5.5" fill="#F43F5E" />
      <circle cx="40" cy="21" r="5.5" fill="#F59E0B" />
      <circle cx="58" cy="21" r="5.5" fill="#10B981" />

      <text x="222" y="25" text-anchor="middle" class="font-mono" font-size="11.5" fill="#64748B" font-weight="600">
        hamza.config.ts — telemetry
      </text>

      <!-- Live Equalizer Bars in Top Right of Window -->
      <g transform="translate(382, 3)">
        <rect class="eq-1" x="0" y="20" width="4" height="16" rx="2" fill="#34D399" />
        <rect class="eq-2" x="7" y="14" width="4" height="22" rx="2" fill="#22D3EE" />
        <rect class="eq-3" x="14" y="18" width="4" height="18" rx="2" fill="#818CF8" />
        <rect class="eq-4" x="21" y="10" width="4" height="26" rx="2" fill="#34D399" />
        <rect class="eq-5" x="28" y="16" width="4" height="20" rx="2" fill="#22D3EE" />
      </g>

      <!-- Code Content Inside Window -->
      <g transform="translate(22, 68)" class="font-mono" font-size="12.5">
        <text x="0" y="0" fill="#475569">01</text>
        <text x="28" y="0" fill="#C084FC">export const</text>
        <text x="126" y="0" fill="#38BDF8">engineer</text>
        <text x="194" y="0" fill="#E2E8F0">= {</text>

        <text x="0" y="24" fill="#475569">02</text>
        <text x="44" y="24" fill="#94A3B8">name:</text>
        <text x="92" y="24" fill="#34D399">"Hamza Ishaq"</text><text x="190" y="24" fill="#64748B">,</text>

        <text x="0" y="48" fill="#475569">03</text>
        <text x="44" y="48" fill="#94A3B8">focus:</text>
        <text x="98" y="48" fill="#FBBF24">"AI-Native Web Products"</text><text x="278" y="48" fill="#64748B">,</text>

        <text x="0" y="72" fill="#475569">04</text>
        <text x="44" y="72" fill="#94A3B8">flagships:</text>
        <text x="126" y="72" fill="#E2E8F0">[</text>
        <text x="136" y="72" fill="#38BDF8">"Curewell"</text><text x="210" y="72" fill="#64748B">,</text>
        <text x="222" y="72" fill="#34D399">"Stash"</text><text x="274" y="72" fill="#64748B">,</text>
        <text x="286" y="72" fill="#818CF8">"GadiGhar"</text>
        <text x="362" y="72" fill="#E2E8F0">],</text>

        <text x="0" y="96" fill="#475569">05</text>
        <text x="44" y="96" fill="#94A3B8">architecture:</text>
        <text x="148" y="96" fill="#34D399">"Offline-First &amp; Real-Time"</text><text x="352" y="96" fill="#64748B">,</text>

        <text x="0" y="120" fill="#475569">06</text>
        <text x="44" y="120" fill="#94A3B8">obsessions:</text>
        <text x="134" y="120" fill="#E2E8F0">[</text>
        <text x="144" y="120" fill="#F472B6">"Clean UX"</text><text x="218" y="120" fill="#64748B">,</text>
        <text x="230" y="120" fill="#38BDF8">"Zero-Latency"</text>
        <text x="336" y="120" fill="#E2E8F0">],</text>

        <text x="0" y="144" fill="#475569">07</text>
        <text x="44" y="144" fill="#94A3B8">status:</text>
        <text x="100" y="144" fill="#34D399">"Shipping daily ⚡"</text>

        <text x="0" y="168" fill="#475569">08</text>
        <text x="28" y="168" fill="#E2E8F0">};</text>
      </g>

      <!-- Bottom Telemetry Metrics Strip inside HUD -->
      <line x1="20" y1="254" x2="424" y2="254" stroke="#1E293B" stroke-width="1" />

      <g transform="translate(24, 268)">
        <!-- Metric 1 -->
        <text x="0" y="12" class="font-mono" font-size="10" fill="#64748B" letter-spacing="0.8">PUBLIC REPOS</text>
        <text x="0" y="32" class="font-sans" font-size="18" font-weight="800" fill="#F8FAFC">36+</text>

        <!-- Metric 2 -->
        <line x1="122" y1="2" x2="122" y2="34" stroke="#1E293B" stroke-width="1" />
        <text x="142" y="12" class="font-mono" font-size="10" fill="#64748B" letter-spacing="0.8">LINES WRITTEN</text>
        <text x="142" y="32" class="font-sans" font-size="18" font-weight="800" fill="#34D399">1.24M+</text>

        <!-- Metric 3 -->
        <line x1="274" y1="2" x2="274" y2="34" stroke="#1E293B" stroke-width="1" />
        <text x="294" y="12" class="font-mono" font-size="10" fill="#64748B" letter-spacing="0.8">CORE STACK</text>
        <text x="294" y="32" class="font-sans" font-size="18" font-weight="800" fill="#38BDF8">TS / Next</text>
      </g>
    </g>

    <!-- Floating Sub-Badge overlapping bottom-left of HUD -->
    <g class="hud-subbadge" transform="translate(656, 338)">
      <rect x="0" y="0" width="210" height="44" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="22" cy="22" r="8" fill="#10B981" fill-opacity="0.2" />
      <path d="M 18 22 L 21 25 L 27 19" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="19" class="font-sans" font-size="11.5" font-weight="700" fill="#F8FAFC">Production Ready</text>
      <text x="38" y="33" class="font-mono" font-size="10" fill="#34D399">Vercel · Supabase · Edge</text>
    </g>

    <!-- Outer Subtle Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="20" ry="20" fill="none" stroke="#1E293B" stroke-width="1.5" />
  </g>
</svg>
